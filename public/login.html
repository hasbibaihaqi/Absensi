<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AbsenSekolah</title>
    <meta name="description" content="Masuk ke portal administrasi dan manajemen absensi sekolah.">
    <!-- Early theme check to prevent flash of wrong theme (FOUC) -->
    <script>
        (function() {
            try {
                var t = localStorage.getItem('app-theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', t);
            } catch(e){}
        })();
    </script>
    <link rel="stylesheet" href="./css/shared.css">
    <link rel="stylesheet" href="./css/animations.css">
    <!-- Font Awesome 6.5.2 — self-hosted (berjalan offline) -->
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.08) 0%, rgba(124, 58, 237, 0.08) 100%), var(--bg-page);
        }

        .auth-wrapper {
            width: 100%;
            max-width: 400px;
            margin: auto;
        }

        .auth-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            padding: 36px 30px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        .auth-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .auth-back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8125rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s;
        }
        .auth-back-link:hover {
            color: var(--primary);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-logo {
            width: 56px;
            height: 56px;
            background: var(--primary-light);
            border-radius: var(--radius-lg);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: var(--primary);
            margin-bottom: 14px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .auth-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .auth-header h1 {
            font-size: 1.375rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .auth-header p {
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        .alert-auth {
            display: none;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 0.8125rem;
            margin-bottom: 20px;
            align-items: center;
            gap: 8px;
            background-color: var(--danger-light);
            color: var(--danger-text);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .auth-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-subtle);
            text-align: center;
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-top-bar">
            <a href="/" class="auth-back-link" title="Kembali ke Beranda Publik">
                <i class="fa-solid fa-arrow-left"></i> Beranda Publik
            </a>
            <button type="button" class="theme-toggle-btn theme-toggle-light" onclick="toggleTheme()" aria-label="Ganti mode gelap/terang">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

        <div class="auth-header">
            <div class="auth-logo" id="auth-logo-box">
                <i class="fa-solid fa-school"></i>
            </div>
            <h1 id="nama-sekolah-login">AbsenSekolah</h1>
            <p>Portal Masuk Administrator &amp; Guru</p>
        </div>

        <div id="alert-login" class="alert-auth" role="alert">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="alert-login-text">Username atau password salah!</span>
        </div>

        <form id="form-login" onsubmit="event.preventDefault(); prosesLogin();" novalidate>
            <div class="form-group">
                <label for="username" class="form-label">Username <span class="required">*</span></label>
                <div class="input-wrapper has-icon-left">
                    <i class="fa-solid fa-user input-icon-left"></i>
                    <input type="text" id="username" class="form-input" placeholder="Masukkan username Anda" autocomplete="username" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password <span class="required">*</span></label>
                <div class="input-wrapper has-icon-left has-btn-right">
                    <i class="fa-solid fa-lock input-icon-left"></i>
                    <input type="password" id="password" class="form-input" placeholder="Masukkan password" autocomplete="current-password" required>
                    <button type="button" class="input-btn-right" onclick="togglePasswordVisibility('password', this)" aria-label="Tampilkan atau sembunyikan password">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="btn-login" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                <span>Masuk Sekarang</span> <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer">
            <p style="margin-bottom: 8px;">
                Belum punya akun guru? <a href="/register">Pendaftaran Guru</a>
            </p>
            <p>
                <a href="/"><i class="fa-solid fa-chart-pie"></i> Lihat Rekap Absensi Publik</a>
            </p>
        </div>
    </div>
</div>

<script src="./js/theme.js"></script>
<script>
    // 1. Cek sesi aktif: Jika sudah login langsung redirect ke dashboard
    fetch('/api/auth/me', { credentials: 'same-origin' })
        .then(r => r.json())
        .then(d => {
            if (d.loggedIn) {
                if (d.role === 'guru') {
                    window.location.href = '/guru-dashboard';
                } else {
                    window.location.href = '/admin';
                }
            }
        })
        .catch(() => {});

    // 2. Muat Nama & Logo Sekolah dinamis dari endpoint FASE 1
    fetch('/api/public/info-sekolah')
        .then(r => r.json())
        .then(d => {
            if (d.namaSekolah) {
                document.getElementById('nama-sekolah-login').textContent = d.namaSekolah;
                document.title = `Login - ${d.namaSekolah}`;
            }
        })
        .catch(() => {});

    // Logo sekolah
    const logoBox = document.getElementById('auth-logo-box');
    const imgLogo = new Image();
    imgLogo.src = '/api/public/logo?t=' + Date.now();
    imgLogo.alt = 'Logo';
    imgLogo.onload = () => {
        logoBox.innerHTML = '';
        logoBox.appendChild(imgLogo);
    };

    // 3. Toggle Visibility Password
    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fa-solid fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fa-solid fa-eye';
        }
    }

    // 4. Proses Login
    const btnLogin = document.getElementById('btn-login');
    const alertBox = document.getElementById('alert-login');
    const alertText = document.getElementById('alert-login-text');

    function tampilkanError(pesan) {
        alertText.textContent = pesan;
        alertBox.style.display = 'flex';
    }

    async function prosesLogin() {
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        alertBox.style.display = 'none';

        if (!username) {
            usernameInput.focus();
            return tampilkanError('Harap masukkan username Anda.');
        }
        if (!password) {
            passwordInput.focus();
            return tampilkanError('Harap masukkan password Anda.');
        }

        // State loading & cegah double-submit
        btnLogin.disabled = true;
        btnLogin.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Memproses...</span>';

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            if (data.sukses) {
                btnLogin.innerHTML = '<i class="fa-solid fa-check"></i> <span>Berhasil! Mengalihkan...</span>';
                if (data.role === 'guru') {
                    if (data.mustChangePassword) {
                        window.location.href = '/guru-dashboard?changePassword=required';
                    } else {
                        window.location.href = '/guru-dashboard';
                    }
                } else {
                    if (data.mustChangePassword) {
                        window.location.href = '/admin?changePassword=required';
                    } else {
                        window.location.href = '/admin';
                    }
                }
            } else {
                // Pesan error ramah dan aman
                tampilkanError(data.pesan || 'Username atau password tidak sesuai.');
                btnLogin.disabled = false;
                btnLogin.innerHTML = '<span>Masuk Sekarang</span> <i class="fa-solid fa-arrow-right"></i>';
            }
        } catch (err) {
            tampilkanError('Gagal terhubung ke server. Periksa koneksi internet Anda.');
            btnLogin.disabled = false;
            btnLogin.innerHTML = '<span>Masuk Sekarang</span> <i class="fa-solid fa-arrow-right"></i>';
        }
    }
</script>

<script src="./js/animations.js"></script>
</body>
</html>
